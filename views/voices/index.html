<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Breeze Blue 音色选择</title>
    <link rel="stylesheet" href="./style.css?v=1.2.1" />
  </head>
  <body>
    <main class="page">
      <header class="header">
        <div>
          <h1>Breeze Blue 音色</h1>
          <p class="muted">
            获取当前 API Key 可用的音色，选择一个作为全局默认音色；
            会话级 /tts_voice use 设置优先。
          </p>
        </div>
        <div class="current" id="current">
          <span class="muted">当前默认</span>
          <strong id="currentVoice">读取中…</strong>
        </div>
      </header>

      <section class="toolbar">
        <input
          id="search"
          type="search"
          placeholder="搜索音色名称、风格或关键词"
          autocomplete="off"
        />
        <select id="language" aria-label="语言筛选">
          <option value="">全部语言</option>
          <option value="zh">中文</option>
          <option value="en">英文</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
        </select>
        <button id="refresh" class="primary" type="button">获取音色</button>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
      <div id="list" class="list"></div>
    </main>

    <script type="module" src="./app.js?v=1.2.1"></script>
  </body>
</html>
